services:
  postgres:
    image: postgres:16-alpine
    container_name: swasth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swasth
      POSTGRES_PASSWORD: swasth
      POSTGRES_DB: swasth
    ports:
      - '5432:5432'
    volumes:
      - swasth-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swasth -d swasth']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  swasth-pgdata:
